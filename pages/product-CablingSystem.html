    <section class="product-list-section">
      <div class="container">
        <!-- Product Search -->
        <div class="product-toolbar">
          <div class="product-search-box">
            <span class="product-search-icon" aria-hidden="true">
              <svg
                class="search-icon-svg"
                viewBox="0 0 24 24"
                focusable="false"
                aria-hidden="true"
              >
                <circle cx="11" cy="11" r="7"></circle>
                <path d="M20 20L16.65 16.65"></path>
              </svg>
            </span>
            <input
              type="text"
              id="productSearchInput"
              placeholder="Search products by name..."
              class="product-search-input"
            />
          </div>
          <select
            id="productSortSelect"
            class="sort-select"
            aria-label="Sort products"
          >
            <option value="az">Sort: A-Z</option>
            <option value="za">Sort: Z-A</option>
          </select>
        </div>

        <div class="products-list" id="productsList">
          <div
            class="product-item"
            data-product-name="ADSS MULTI-LOOSE TUBE FIBRE OPTIC CABLE"
          >
            <div class="product-item-image">
              <img
                src="../assets/images/ADSSMULTI-LOOSE.png"
                alt="Forteq LC Adapter"
              />
            </div>
            <h3>ADSS MULTI-LOOSE TUBE FIBRE OPTIC CABLE</h3>
            <a
              href="../assets/pdf/cabling/ADSS MULTI-LOOSE TUBE FIBRE OPTIC CABLE-datasheet.pdf"
              download
              class="btn btn-datasheet"
              >Datasheet</a
            >
          </div>

          <div
            class="product-item"
            data-product-name="High Density Fibre Optic Patch Panel"
          >
            <div class="product-item-image">
              <img
                src="../assets/images/HighDensityFibreOptic.png"
                alt="Forteq SC Adapter"
              />
            </div>
            <h3>High Density Fibre Optic Patch Panel</h3>
            <a
              href="../assets/pdf/cabling/High Density Fibre Optic Patch Panel-datasheet.pdf"
              download
              class="btn btn-datasheet"
              >Datasheet</a
            >
          </div>

          <div
            class="product-item"
            data-product-name="High Density 1U Loaded 48 Port Patch Panel"
          >
            <div class="product-item-image">
              <img
                src="../assets/images/HighDensity1U.png"
                alt="Forteq Splice Tray"
              />
            </div>
            <h3>High Density 1U Loaded 48 Port Patch Panel</h3>
            <a
              href="../assets/pdf/cabling/High Density 1U Loaded-datasheet.pdf"
              download
              class="btn btn-datasheet"
              >Datasheet</a
            >
          </div>
        </div>
      </div>
    </section>

    <!-- JavaScript -->
    <script src="../assets/js/main.js"></script>
    <script>
      // Product Search Functionality
      document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("productSearchInput");
        const sortSelect = document.getElementById("productSortSelect");
        const productsList = document.getElementById("productsList");
        const productItems = Array.from(
          productsList.querySelectorAll(".product-item"),
        );

        const sortItems = (order) => {
          const sorted = [...productItems].sort((a, b) => {
            const nameA = (a.dataset.productName || "").toLowerCase();
            const nameB = (b.dataset.productName || "").toLowerCase();
            return order === "za"
              ? nameB.localeCompare(nameA)
              : nameA.localeCompare(nameB);
          });

          sorted.forEach((item) => productsList.appendChild(item));
        };

        sortItems("az");

        if (searchInput) {
          searchInput.addEventListener("input", function (e) {
            const searchQuery = e.target.value.toLowerCase().trim();

            productItems.forEach((item) => {
              const productName = (
                item.dataset.productName || ""
              ).toLowerCase();

              if (productName.includes(searchQuery)) {
                item.style.display = "block";
              } else {
                item.style.display = "none";
              }
            });
          });
        }

        if (sortSelect) {
          sortSelect.addEventListener("change", function (e) {
            sortItems(e.target.value);
          });
        }
      });
    </script>
    <script src="../assets/js/scroll-reveal.js"></script>
  </body>
