<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail - Swarnadipa</title>
    <link rel="icon" type="image/png" href="../assets/images/logox.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
  </head>
  <body>

    <section class="product-detail-section">
      <div class="container">
        <div class="product-detail-grid">
          <div class="product-detail-media">
            <img src="../assets/images/logo.png" alt="Loading..." id="mainProductImg" />
          </div>
          <div class="product-detail-info">
            <h2>Loading...</h2>
            <p class="product-detail-code">Please wait...</p>
            <p class="product-detail-desc">
              </p>
            <div class="product-detail-actions">
              <a href="where-to-buy.html" class="btn btn-quick-enquiry">Quick Enquiry</a>
              <a href="#" download class="btn btn-outline" id="datasheetLink">Datasheet</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="product-datasheet-section" style="display: none;">
      <div class="container text-center">
        <h4 style="margin-bottom: 20px; font-weight: 700; color: #333;">Product Documentation</h4>
        
        <div class="pdf-preview-container" style="background: #f1f1f1; border-radius: 12px; overflow: hidden; position: relative; min-height: 300px;">
            <div id="pdf-loader" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
                <p>Rendering PDF...</p>
            </div>
            <canvas id="pdf-render" style="width: 100%; height: auto; display: block;"></canvas>
        </div>
        
        <p style="margin-top: 15px; color: #666;">
            Trouble viewing? <a href="#" id="manualDownload" download class="text-primary" style="font-weight: 600;">Click here to download instead.</a>
        </p>
      </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="../assets/js/navbar-loader.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/product-detail.js"></script>

  </body>
</html>
