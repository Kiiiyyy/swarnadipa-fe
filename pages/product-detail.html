<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Detail - Swarnadipa</title>
    <link rel="icon" type="image/png" href="../assets/images/logox.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
  </head>
  <body>

    <section class="product-detail-section">
      <div class="container">
        <div class="product-detail-grid">
          <div class="product-detail-media">
            <img src="../assets/images/logo.png" alt="Loading..." id="mainProductImg" />
          </div>
          <div class="product-detail-info">
            <h2>Loading...</h2>
            <p class="product-detail-code">Please wait...</p>
            <p class="product-detail-desc">
              </p>
            <div class="product-detail-actions">
              <a href="where-to-buy.html" class="btn btn-quick-enquiry">Quick Enquiry</a>
              <a href="#" download class="btn btn-outline" id="datasheetLink">Datasheet</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="product-datasheet-section" style="display: none;">
      <div class="container text-center">
        <h4 style="margin-bottom: 20px; font-weight: 700; color: #333;">Product Documentation</h4>

        <div class="pdf-nav-bar" style="background: #333; color: white; padding: 10px; border-radius: 8px 8px 0 0; display: flex; justify-content: center; align-items: center; gap: 20px;">
          <button id="prev-page" class="btn-nav" style="background: #e31e24; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer;">Prev</button>
          
          <span style="font-size: 14px;">Page: <span id="page-num">1</span> / <span id="page-count">0</span></span>
          
          <button id="next-page" class="btn-nav" style="background: #e31e24; color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer;">Next</button>
        </div>

        <div class="pdf-preview-container" style="background: #525659; padding: 10px; border-radius: 0 0 8px 8px; border: 1px solid #333;">
          <canvas id="pdf-render" style="width: 100%; height: auto; display: block; margin: 0 auto;"></canvas>
        </div>

        <p style="margin-top: 15px; color: #666;">
          Trouble viewing? <a href="#" id="manualDownload" download class="text-primary" style="font-weight: 600;">Click here to download instead.</a>
        </p>
      </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="../assets/js/navbar-loader.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/js/env.js"></script>
    <script src="../assets/js/product-detail.js"></script>

  </body>
</html>
