<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Contact Us Swarnadipa" />
    <title>Contact Us - Swarnadipa</title>

    <!-- Google Fonts - Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
  </head>
  <body>

    <!-- Page Content -->
    <section class="page-header page-header-wheretobuy"></section>

    <section class="contact-section">
      <div class="container">
        <div class="contact-form-section">
          <h2>Connect With Us</h2>
          <p class="contact-subtitle">
            Tell us what you need and our team will get back to you quickly.
          </p>

          <form
            class="contact-form"
            id="contactForm"
            action="https://api.web3forms.com/submit"
            method="POST"
          >
            <!-- Web3Forms Access Key - GANTI DENGAN ACCESS KEY ANDA -->
            <input
              type="hidden"
              name="access_key"
              value="bb4570cf-f2d1-4ebe-a3cd-229ade59d57f"
            />
            <input
              type="hidden"
              name="subject"
              value="New Contact Form Submission from Swarnadipa Website"
            />
            <input type="hidden" name="from_name" value="Swarnadipa Website" />

            <div class="form-group full-width">
              <label for="name">Full Name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Your name"
                required
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="company">Company</label>
                <input
                  type="text"
                  id="company"
                  name="company"
                  placeholder="Company name"
                />
              </div>
              <div class="form-group">
                <label for="country">Country</label>
                <select id="country" name="country" required>
                  <option value="">Choose a country</option>
                  <option value="Indonesia">Indonesia</option>
                  <option value="Malaysia">Malaysia</option>
                  <option value="Singapore">Singapore</option>
                  <option value="Thailand">Thailand</option>
                  <option value="Philippines">Philippines</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
              <div class="form-group">
                <label for="phone">Phone</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="Phone #"
                />
              </div>
            </div>

            <div class="form-group full-width">
              <label for="subject">Subject</label>
              <input
                type="text"
                id="subject"
                name="custom_subject"
                placeholder="Subject"
              />
            </div>

            <div class="form-group full-width">
              <label for="message">Message</label>
              <textarea
                id="message"
                name="message"
                placeholder="Write your message"
                rows="8"
                required
              ></textarea>
            </div>

            <button type="submit" class="btn btn-submit">Send Message</button>
          </form>
        </div>
      </div>
    </section>

    <!-- JavaScript -->
    <script src="../assets/js/navbar-loader.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/scroll-reveal.js"></script>
  </body>
</html>
